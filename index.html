<main><section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Small discoveries. Big ideas.</div><h1>Curiosity is the start of every adventure.</h1><p class="lead">A friendly corner for children and families to explore science, nature, space and everyday wonders—with simple activities you can try at home.</p><a class="btn" href="#explore">Start exploring ↓</a><a class="btn alt" href="#experiment">Try a 10-minute experiment</a><p class="notice">Made for curious minds, with grown-ups nearby for hands-on activities.</p></div><div class="hero-art"><div class="planet" aria-hidden="true">🌍 🔭 ✨</div><h2>Ask a question. Find a wonder.</h2><p>Look closely, make a guess, test an idea, and discover something new.</p></div></div></section>

<section id="explore"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Pick your next discovery</div><h2>Explore the world around you</h2></div><p class="muted">Short reads, practical ideas and questions to spark conversation.</p></div><div class="grid"><article class="card"><div class="emoji" aria-hidden="true">🚀</div><span class="pill">SPACE</span><h3>Why does the Moon change shape?</h3><p>The Moon doesn't actually change shape. We see different amounts of its sunlit half as it travels around Earth.</p><p><strong>Try this:</strong> Shine a torch on a ball in a dim room. Slowly turn around the ball and notice how the bright part seems to change.</p></article><article class="card"><div class="emoji" aria-hidden="true">🐝</div><span class="pill">NATURE</span><h3>Why are bees important?</h3><p>When bees visit flowers for nectar and pollen, they can carry pollen from one flower to another. This helps many plants make fruits and seeds.</p><p><strong>Look for:</strong> Watch flowers from a safe distance and count how many different visitors you spot in five minutes.</p></article><article class="card"><div class="emoji" aria-hidden="true">🌈</div><span class="pill">WEATHER</span><h3>How does a rainbow appear?</h3><p>Sunlight bends and separates into colours as it enters and leaves tiny water droplets. A rainbow is easiest to see when the Sun is behind you and rain is ahead.</p><p><strong>Remember:</strong> Never look directly at the Sun.</p></article><article class="card"><div class="emoji" aria-hidden="true">🐙</div><span class="pill">OCEAN</span><h3>How do octopuses hide?</h3><p>Octopuses can change the colour and texture of their skin to blend into their surroundings. Their soft bodies also help them squeeze into small spaces.</p><p><strong>Think about it:</strong> What colours would help an animal hide on sand, seaweed or a rocky reef?</p></article><article class="card"><div class="emoji" aria-hidden="true">🌱</div><span class="pill">PLANTS</span><h3>What does a seed need?</h3><p>Most seeds need water, oxygen and a suitable temperature to begin growing. Many seedlings also need light to grow well after they sprout.</p><p><strong>Try this:</strong> Place a few beans on damp paper towel in a clear container and check them daily with an adult.</p></article><article class="card"><div class="emoji" aria-hidden="true">🧲</div><span class="pill">EVERYDAY SCIENCE</span><h3>What can a magnet attract?</h3><p>Magnets attract some materials containing iron or steel. They don't attract every metal, so a coin, foil or aluminium can may behave differently from a steel paper clip.</p><p><strong>Make a list:</strong> With an adult, test safe household objects and record which ones are attracted.</p></article></div></div></section>
<section id="experiment"><div class="wrap"><div class="feature"><div><div class="eyebrow">Hands-on learning</div><h2>Experiment: Make a paper bridge</h2><p>Can one sheet of paper hold more coins when it is folded? Test how shape changes strength.</p><h3>You will need</h3><ul><li>Two sturdy books of the same height</li><li>One sheet of paper</li><li>A few coins or small counters</li><li>A flat table and a grown-up to help</li></ul></div><div><h3>Follow the steps</h3><ol class="steps"><li>Place the books a short distance apart.</li><li>Lay the paper flat across them like a bridge.</li><li>Add coins one at a time in the centre. Stop if the paper bends too much.</li><li>Fold a second sheet into an accordion shape and place it across the books.</li><li>Repeat with the same coins. Compare the results.</li></ol><p><strong>What happened?</strong> Folds can make paper harder to bend because they change how the material carries a load. Engineers use shapes and structures for the same reason.</p><p class="notice">Keep coins away from small children and never put materials in your mouth.</p></div></div></div></section>

<section id="quiz"><div class="wrap"><div class="eyebrow">Quick brain break</div><h2>Can you answer this?</h2><div class="quiz"><p><strong>Which planet is famous for its beautiful rings?</strong></p><button type="button" data-answer="wrong">Mars</button><button type="button" data-answer="right">Saturn</button><button type="button" data-answer="wrong">Mercury</button><p id="answer" aria-live="polite"></p><p class="notice">Learning tip: explain why you chose your answer. Saying what you know helps you remember it.</p></div></div></section>
<section><div class="wrap"><div class="feature"><div><div class="eyebrow">A little learning habit</div><h2>Keep a wonder journal</h2><p>Choose one question each day. Draw what you think the answer might be, look for clues, then write or tell someone what you discovered.</p></div><div><h3>Three questions to get started</h3><ul><li>Why do shadows move during the day?</li><li>How can birds fly without engines?</li><li>Why does ice float in water?</li></ul><p>There is no need to know every answer right away. Good scientists ask questions, test ideas and learn from surprises.</p></div></div></div></section></main>
